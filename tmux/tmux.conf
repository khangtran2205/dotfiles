unbind r
unbind C-b

set -g mouse on
set -g prefix C-a
set -g default-terminal "${TERM}"
set -sg terminal-overrides ',*:RGB'
set -g base-index 1
set -g pane-base-index 1
set -g focus-events on
set -g status-position top

set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind r source-file $HOME/.config/tmux/tmux.conf
bind C-a send-prefix

# Split window
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -v -v "#{pane_current_path}"
bind s split-window -h -c "#{pane_current_path}"

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt + n to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Colors
green="#a6e3a1"
sky="#89dceb"
yellow="#f9e2af"
red="#f38ba8"
blue="#89b4fa"
crust="#11111b"
maroon="#eba0ac"

# Status bar
set -g status-style bg=default
set -g status-left ""
set -g status-right "#[fg=${green},bold]#S  "

# Window buttons
set -g window-status-format "#[fg=${blue}] #I: #W"
set -g window-status-current-format "#[fg=${red},bold] #I: #[fg=${green}](✓) #W"
set -g window-status-separator ""
set -g renumber-windows on

set -g clock-mode-colour "${blue}"
set -g mode-style "fg=${blue} bg=${crust} bold"

# Panes
set -g pane-border-style "fg=${red}"
set -g pane-active-border-style "fg=${green}"
